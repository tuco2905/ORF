<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>Monitoramento ORF</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/modern-css-reset" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
  </head>
  <body>
    <div class="page">
      <h1>Console de Monitoramento</h1>
      <div class="container">
        <section class="panel" id="sites-panel">
          <h2>Sites monitorados: <span id="sites-count">{{ sites_count }}</span></h2>
          <form id="add-form">
            <label>Nova URL</label>
            <input id="url-input" placeholder="https://exemplo.com" required />
            <button type="submit" class="btn btn--primary">Adicionar</button>
          </form>
          <ul id="sites-list"></ul>
        </section>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
  </body>
</html>
